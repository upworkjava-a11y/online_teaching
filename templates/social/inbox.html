{% extends "base.html" %}
{% load social_tags %}
{% block title %}{{ "Xabarlar"|loc }}{% endblock %}
{% block content %}
<div class="social-inbox">
  <div class="flex items-center justify-between gap-3">
    <h1 class="text-2xl font-extrabold">{{ "Xabarlar"|loc }}</h1>
    <span id="inbox-unread-total">
      {% if unread_total %}<span class="social-badge">{{ unread_total }}</span>{% endif %}
    </span>
  </div>
  <div
    id="inbox-list"
    class="mt-4 space-y-2"
    hx-get="{% url 'social:inbox' %}"
    hx-trigger="every 4s [document.visibilityState=='visible']"
    hx-swap="innerHTML"
  >
    {% include "social/partials/inbox_rows.html" %}
  </div>
</div>
{% endblock %}
