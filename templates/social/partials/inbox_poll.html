{% load social_tags %}
{# Main swap target: conversation rows #}
{% include "social/partials/inbox_rows.html" %}
{# Keep page header + navbar badges in sync without full refresh #}
<span id="inbox-unread-total" hx-swap-oob="true">
  {% if unread_total %}<span class="social-badge">{{ unread_total }}</span>{% endif %}

</span>
