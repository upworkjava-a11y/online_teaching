{% extends "base.html" %}
{% block title %}Ro‘yxatdan o‘tish{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="card">
    <h1 class="text-2xl font-semibold">Ro‘yxatdan o‘tish</h1>
    <p class="muted mt-2">Email va parol bilan hisob yarating.</p>
    <form method="post" class="mt-4 space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <label class="block">
          <span class="mb-1 block text-sm">{{ field.label }}</span>
          {{ field }}
          {{ field.errors }}
        </label>
      {% endfor %}
      <button class="btn btn-primary w-full" type="submit">Hisob yaratish</button>
    </form>
    <p class="mt-4 text-sm">Allaqachon hisobingiz bormi? <a class="text-sky-600" href="{% url 'accounts:login' %}">Kirish</a></p>
  </div>
</div>
{% endblock %}
